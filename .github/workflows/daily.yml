name: Daily Shakopee Community Center Hours

on:
  schedule:
    # GitHub cron uses UTC. 12:00 UTC is 6 AM CST / 7 AM CDT.
    # If you need exactly 6 AM local year-round, use the optional two-cron
    # strategy documented in README.md or an external timezone-aware scheduler.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shakopee-hours-daily
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
      - run: git log -1 --oneline && sed -n '44,72p' tests/test_scraper.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check official hours and post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USERNAME: ${{ vars.DISCORD_USERNAME || 'Shakopee Hours Bot' }}
          DISCORD_AVATAR_URL: ${{ vars.DISCORD_AVATAR_URL }}
          DISCORD_PING_ON_ALERT: ${{ vars.DISCORD_PING_ON_ALERT }}
          SEND_MODE: ${{ vars.SEND_MODE || 'daily' }}
        run: python scraper.py

      - name: Persist last successful result
        if: success()
        run: |
          if git diff --quiet -- state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update hours bot state [skip ci]"
          git push
